name: Change request
description: Request an approved repository, documentation, or future capability change.
title: 'change: '
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only a proposed solution.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and users
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope and out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture status
      options:
        - Not an architecture change
        - Architecture proposal required
        - Approved ADR exists
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: ADR link
      description: Required when an ADR already exists.
