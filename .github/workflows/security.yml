name: Security Scanning

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  GITLEAKS_VERSION: 8.30.1

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks Open Source
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            --output "/tmp/${asset}" "${base_url}/${asset}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            --output "/tmp/${checksums}" "${base_url}/${checksums}"
          grep " ${asset}$" "/tmp/${checksums}" | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan with Gitleaks Open Source
        run: gitleaks detect --source . --redact --verbose

  package-audit:
    name: Package audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Audit locked JavaScript dependencies
        run: pnpm audit --audit-level high
